apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui-helm
  namespace: argocd
spec:
  destination:
    namespace: openwebui
    server: https://kubernetes.default.svc
  project: platform
  source:
    chart: open-webui
    repoURL: https://open-webui.github.io/helm-charts
    targetRevision: 15.2.1
    helm:
      valuesObject:
        ollama:
          enabled: false
        pipeline:
          enabled: false
        # Une connexion par provider : OpenWebUI interroge chaque `/v1/models`
        # et fusionne les listes dans un seul sélecteur de modèles.
        openaiBaseApiUrls:
          - http://agentgateway-proxy.agentgateway-system.svc.cluster.local/openai/v1
          - http://agentgateway-proxy.agentgateway-system.svc.cluster.local/anthropic/v1
        # Clés factices : l'authentification réelle est injectée par la gateway
        # depuis les Secrets (`policies.auth.secretRef`). La liste doit avoir
        # exactement le même nombre d'entrées que `openaiBaseApiUrls`.
        openaiApiKeys:
          - "via-agentgateway"
          - "via-agentgateway"
  syncPolicy:
    automated:
      # Prune resources during auto-syncing (default is false)
      prune: true 
      # Sync the app in part when resources are changed only in the target Kubernetes cluster
      # but not in the git source (default is false).
      selfHeal: true 
    syncOptions:
    - CreateNamespace=true