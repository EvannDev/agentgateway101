apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: anthropic-prompt-guard
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: anthropic
  backend:
    ai:
      promptGuard:
        request:
        - regex:
            builtins:
            - Ssn
            - CreditCard
            - Email
            - CaSin
            - PhoneNumber
            action: Mask
        response:
        - regex:
            builtins:
            - Ssn
            - CreditCard
            - Email
            - CaSin
            - PhoneNumber
            action: Mask