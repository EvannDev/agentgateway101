apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  destination:
    namespace: agentgateway-system
    server: https://kubernetes.default.svc
  project: platform
  source:
    chart: agentgateway
    helm:
      skipCrds: false
      parameters:
      - name: controller.image.pullPolicy
        value: "Always"
      - name: controller.extraEnv.KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES
        value: "true"
    repoURL: cr.agentgateway.dev/charts
    targetRevision: v1.4.1
  syncPolicy:
    automated:
      # Prune resources during auto-syncing (default is false)
      prune: true 
      # Sync the app in part when resources are changed only in the target Kubernetes cluster
      # but not in the git source (default is false).
      selfHeal: true 
    syncOptions:
    - CreateNamespace=true