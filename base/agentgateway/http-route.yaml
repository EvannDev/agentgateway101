apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: google
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
  - backendRefs:
    - name: google
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend
      weight: 1	
    matches:	
      - path:	
          type: PathPrefix	
          value: /