apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: argocd-mcp
    app.kubernetes.io/component: mcp-server
spec:
  # `--stateless` supprime l'affinité de session, donc ce Deployment peut
  # monter à plusieurs replicas si le backend MCP est en sessionRouting: Stateless.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: quay.io/argoprojlabs/mcp-for-argocd:v0.8.0
        # Transport HTTP stream : écoute POST /mcp sur le port 3000.
        # Correspond au défaut d'agentgateway pour protocol: StreamableHTTP.
        args: ["http", "--stateless"]
        ports:
        - name: mcp
          containerPort: 3000
        env:
        # argocd-server tourne en TLS (server.insecure non activé), donc https.
        - name: ARGOCD_BASE_URL
          value: https://argocd-server.argocd.svc
        # Certificat auto-signé d'Argo CD. Acceptable en cluster local, à retirer
        # dès qu'un vrai certificat est en place — cela désactive la vérification TLS.
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: ARGOCD_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: argocd-mcp-secret
              key: token
        # Plancher de sécurité : désactive create/update/delete/sync_application
        # et run_resource_action côté serveur. L'autorisation fine par outil se
        # fait au niveau du gateway ; ceci protège si quelqu'un joint le Service
        # en direct. Passer à "false" seulement quand une NetworkPolicy est en place.
        - name: MCP_READ_ONLY
          value: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Pas de sonde HTTP : l'endpoint /mcp répond en POST, un GET de probe
        # n'est pas garanti sain. Une sonde TCP suffit ici.
        readinessProbe:
          tcpSocket:
            port: mcp
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: mcp
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        # Requis par readOnlyRootFilesystem : Node écrit dans /tmp.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: argocd-mcp
spec:
  selector:
    app.kubernetes.io/name: argocd-mcp
  ports:
  - name: mcp
    port: 3000
    targetPort: mcp
