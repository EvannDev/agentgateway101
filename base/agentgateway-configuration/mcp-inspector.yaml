# Outil de DÉVELOPPEMENT, volontairement non exposé.
#
# Le backend de MCP Inspector peut lancer des processus (transport stdio) :
# CVE-2025-49596 (CVSS 9.4) permettait une RCE non authentifiée avant la 0.14.1.
# En conséquence, ici :
#   - l'authentification par token reste ACTIVE (pas de DANGEROUSLY_OMIT_AUTH)
#   - le Service est en ClusterIP, sans HTTPRoute ni LoadBalancer
#   - l'accès se fait uniquement par `kubectl port-forward` (voir README §5)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-inspector
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: mcp-inspector
    app.kubernetes.io/component: dev-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-inspector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-inspector
    spec:
      securityContext:
        # L'image déclare User: node. Le nom n'étant pas numérique, kubelet ne
        # peut pas vérifier runAsNonRoot sans runAsUser explicite — d'où l'UID
        # en dur (vérifié : node = 1000:1000 dans l'image).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Indispensable : sans fsGroup, kubelet monte les emptyDir en root:root et
        # le conteneur non-root ne peut pas y écrire. C'est ce qui provoque
        # "ENOENT ... mkdir '/home/node/.mcp-inspector'" (le vrai code est EROFS
        # ou EACCES selon le cas).
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inspector
        image: ghcr.io/modelcontextprotocol/inspector:2.0.0
        # Pas de command/args : l'ENTRYPOINT est `mcp-inspector` et le CMD par
        # défaut `--web`, ce qui est exactement le mode voulu. Toute surcharge
        # d'`args` remplacerait le CMD en entier.
        ports:
        - name: http
          containerPort: 6274
        env:
        # Token fixe plutôt qu'auto-généré : sinon il change à chaque redémarrage
        # et il faut le relire dans les logs du pod.
        - name: MCP_INSPECTOR_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-inspector-secret
              key: token
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # La racine de l'UI répond 200 sans token (le token protège l'API).
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        # Requis par readOnlyRootFilesystem.
        - name: tmp
          mountPath: /tmp
        # L'Inspector persiste la liste des serveurs dans $HOME/.mcp-inspector.
        # Monter le sous-dossier précis, et non /home/node en entier : un montage
        # sur le HOME empêche la création de sous-dossiers par l'utilisateur node.
        # Contrepartie de l'emptyDir : la liste est perdue à chaque redémarrage
        # du pod. Remplacer par un PVC si tu veux qu'elle survive.
        - name: config
          mountPath: /home/node/.mcp-inspector
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-inspector
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: mcp-inspector
spec:
  # ClusterIP délibérément : aucune exposition hors du cluster.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-inspector
  ports:
  - name: http
    port: 6274
    targetPort: http
