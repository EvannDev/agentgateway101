apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: google
  namespace: agentgateway-system
spec:
  ai:
    provider:
      gemini:
        model: gemini-2.5-flash-lite
  policies:
    auth:
      secretRef:
        name: google-secret
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: anthropic
  namespace: agentgateway-system
spec:
  ai:
    provider:
      anthropic: {}
  # Pas de `model:` ici volontairement. Le renseigner écrase le modèle demandé
  # par le client : OpenWebUI afficherait toute la liste Claude mais chaque
  # choix retomberait silencieusement sur le modèle épinglé.
  policies:
    auth:
      secretRef:
        name: anthropic-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        # `Models` est refusé par le data plane en v1.4.1 (501 "Route 'Models'
        # not implemented"). `Passthrough` relaie la requête telle quelle et
        # renvoie la liste de modèles de l'upstream.
        "/v1/models": Passthrough
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai: {}
  policies:
    auth:
      secretRef:
        name: openai-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/models": Passthrough