apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-tools
  namespace: agentgateway-system
spec:
  mcp:
    # Correspond à --stateless sur le Deployment argocd-mcp : pas d'affinité de
    # session, donc le serveur MCP peut monter en replicas.
    sessionRouting: Stateless
    # prefixMode non défini = Conditional : avec un seul target les noms d'outils
    # restent nus, ce qui rend la liste directement comparable à celle obtenue en
    # attaquant argocd-mcp sans passer par la passerelle. Passer à Always dès
    # qu'un second target est ajouté, pour éviter les collisions de noms.
    targets:
    - name: argocd
      static:
        # Service namespace-local ; remplace uniquement l'hôte, les autres champs
        # restent explicites.
        backendRef:
          name: argocd-mcp
        port: 3000
        path: /mcp
        protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
    namespace: agentgateway-system
  rules:
  # PathPrefix /mcp est plus spécifique que le PathPrefix / de la route
  # `anthropic` : par les règles de précédence Gateway API, il gagne. Sans cette
  # route, POST /mcp est traité comme une complétion LLM et échoue en 503
  # ("failed to parse request: missing field `messages`").
  - matches:
    - path:
        type: PathPrefix
        value: /mcp
    backendRefs:
    - name: mcp-tools
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend
      weight: 1
